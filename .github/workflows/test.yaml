name: "Salesforce Pipeline Test"
run-name: "Salesforce Pipeline Test Run"

on:
  push:

jobs:
  setup-salesforce:
    name: "Setup Salesforce"
    runs-on: ubuntu-latest
    
    steps:
        - name: "setup Salesforce CLI"
          run: npm install --global @salesforce/cli@latest

        - name: "check sf cli version"
          run: sf --version

        - name: "Install Salesforce Code Analyzeraa"
          run: |
            sf --help
            sf plugins install code-analyzer

        - name: "Authenticate with Salesforce"
          run: sf org login sfdx-url --sfdx-url-file tmp/authFile.txt --set-default --alias rm-dev-new
